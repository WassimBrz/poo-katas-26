name: Tests

on: [push, pull_request]

jobs:
  katas:
    name: Niveau ${{ matrix.niveau }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        niveau: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: composer test -- --group=niveau-${{ matrix.niveau }}
